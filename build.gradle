plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'study-assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // Text extraction t??? file upload ??? ????? AI chat ?????c ???????c n???i dung PDF/DOCX/PPTX th???t
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.poi:poi-scratchpad:5.3.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'io.github.open-spaced-repetition:fsrs:1.0.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'Integration', 'E2E'
    }
}

task mysqlIntegrationTest(type: Test) {
    description = 'Runs MySQL Integration Tests'
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    systemProperty 'qa.integration.reset-database', providers.gradleProperty('resetQaDatabase').getOrElse('false')
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'Integration'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Load Mockito at startup; self-attachment can hang on restricted Windows sessions.
tasks.withType(Test).configureEach {
    doFirst {
        def testTemp = layout.buildDirectory.dir('tmp/test-runtime').get().asFile
        testTemp.mkdirs()
        systemProperty 'java.io.tmpdir', testTemp.absolutePath
        def mockitoJar = classpath.files.find { it.name.startsWith('mockito-core-') && it.name.endsWith('.jar') }
        if (mockitoJar != null) jvmArgs "-javaagent:${mockitoJar.absolutePath}"
    }
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'spring.test.context.cache.maxSize', '4'
    systemProperty 'APP_LOG_DIR', layout.buildDirectory.dir('test-logs').get().asFile.absolutePath
}

tasks.register('e2eTest', Test) {
    description = 'Runs real MySQL/Qdrant pipeline tests with deterministic AI fixtures'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'E2E' }
}
