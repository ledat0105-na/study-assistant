spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

qdrant.host=localhost
qdrant.port=6334
qdrant.api.key=test-key

openai.api.key=test-key

# But H2 DOES NOT SUPPORT MySQL FULLTEXT!
# We will use this application.properties just to get basic tests to pass without crashing on DB auth,
# but for REAL FULLTEXT we need a real MySQL DB.
# For Checkpoint 7, we will run RagEndToEndTest manually with a real DB.
payment.webhook.secret=12345
