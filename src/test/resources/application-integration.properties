spring.datasource.url=jdbc:mysql://127.0.0.1:3306/studyassistant_rag_test?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do NOT use create-drop for real DB certification. Use validate or update.
# We will use "none" because the provisioning is done externally via manual script testing.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

qdrant.host=localhost
qdrant.port=6333
qdrant.api.key=${TEST_QDRANT_API_KEY:}

# QdrantVectorStore reads these:
rag.qdrant.url=http://localhost:6333
rag.qdrant.api-key=${TEST_QDRANT_API_KEY:}
rag.qdrant.collection-prefix=rag_test_e2e

# Stub model name used by the deterministic E2E embedding provider
ai.embedding.model=stub-e2e-model
ai.embedding.dimension=4
ai.embedding.batch-size=100

openai.api.key=stub-no-call
ai.grounded.temperature=0.1

payment.webhook.secret=dummy-test-secret

# Legacy AI mocks in MySQL integration tests use geometry JSON.
presentation.slide.layout-mode=FREEFORM
