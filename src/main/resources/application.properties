spring.application.name=study-assistant

spring.datasource.url=jdbc:mysql://localhost:3306/study_assistant?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=dat1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
presentation.media.storage-root=${PRESENTATION_MEDIA_STORAGE_ROOT:storage_private/presentation-media}

# OpenAI API Key configuration
# Set OPENAI_API_KEY in the environment before running the app.
openai.api.key=${OPENAI_API_KEY}

# Webhook shared secret dùng để verify callback từ cổng thanh toán
payment.webhook.secret=12345

# RAG / Embedding Configuration
ai.embedding.model=text-embedding-3-small
ai.embedding.dimension=1536
ai.embedding.batch-size=100

# Shared AI provider output budget for grounded generation and chat.
ai.chat.context-window-tokens=16000
ai.chat.max-output-tokens=4000

# Qdrant Vector DB Configuration
rag.qdrant.url=${QDRANT_URL:http://localhost:6333}
rag.qdrant.api-key=${QDRANT_API_KEY:}
rag.qdrant.collection-prefix=rag
rag.qdrant.connect-timeout=5000
rag.qdrant.read-timeout=30000
