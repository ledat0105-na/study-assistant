spring.application.name=study-assistant

spring.datasource.url=jdbc:mysql://localhost:3306/study_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB

# OpenAI API Key configuration
# Set OPENAI_API_KEY in the environment before running the app.
openai.api.key=${OPENAI_API_KEY:}

