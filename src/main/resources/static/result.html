<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Kết Quả Bài Thi 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto flex flex-col items-center relative z-10">
    <div class="w-full max-w-2xl">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-md">
          <i data-lucide="award" class="h-10 w-10"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
          Hoàn Thành Bài Kiểm Tra Trắc Nghiệm AI!
        </h1>
        <p class="text-slate-600 text-sm mt-1 font-semibold">Dưới đây là kết quả đánh giá năng lực của bạn</p>
      </div>

      <!-- Score Card 3D -->
      <div class="glass-3d-card p-8 mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
        <div>
          <h2 class="text-xl font-extrabold text-slate-900">Điểm Số Của Bạn</h2>
          <p class="text-sm text-slate-700 mt-1 font-semibold">Bạn đã làm đúng <span id="scoreVal" class="text-indigo-600 font-extrabold">0</span> trên tổng số <span id="totalVal" class="text-indigo-600 font-extrabold">3</span> câu hỏi.</p>
          <div class="mt-4 badge-3d badge-3d-emerald">
            Xuất sắc! Tiếp tục phát huy tinh thần học tập.
          </div>
        </div>

        <div class="relative flex items-center justify-center">
          <div class="w-28 h-28 rounded-full border-4 border-indigo-200 flex items-center justify-center bg-white shadow-inner">
            <span id="scorePercentage" class="text-2xl font-extrabold text-indigo-700 font-mono">0%</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-between gap-4">
        <a id="retryBtn" href="quiz.html" class="btn-3d btn-3d-secondary py-3.5 px-6 text-sm font-bold flex-1 text-center">
          <i data-lucide="rotate-ccw" class="h-4 w-4"></i> Làm Lại Bài Thi
        </a>
        <a id="docBtn" href="documents.html" class="btn-3d btn-3d-primary py-3.5 px-6 text-sm font-bold shadow-xl shadow-indigo-500/30 flex-1 text-center">
          Trở Về Kho Tài Liệu <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </a>
      </div>
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderUnifiedSidebar("quiz");

    const urlParams = new URLSearchParams(window.location.search);
    const score = parseInt(urlParams.get("score") || "0");
    const total = parseInt(urlParams.get("total") || "3");
    const docId = urlParams.get("id") || "1";

    document.getElementById("scoreVal").textContent = score;
    document.getElementById("totalVal").textContent = total;
    document.getElementById("retryBtn").href = `quiz.html?id=${docId}`;
    document.getElementById("docBtn").href = `detail.html?id=${docId}`;

    const pct = Math.round((score / total) * 100);
    document.getElementById("scorePercentage").textContent = `${pct}%`;

    lucide.createIcons();
  </script>
</body>
</html>
