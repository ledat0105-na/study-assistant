<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Quản Lý Tài Liệu 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto relative z-10">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
          Kho Tài Liệu Học Tập
        </h1>
        <p class="text-slate-600 text-sm mt-1.5 font-semibold">Quản lý và truy cập các giáo trình, sách báo đã được phân tích 3D</p>
      </div>
      <a href="upload.html" class="btn-3d btn-3d-primary px-6 py-3 text-xs font-extrabold shadow-xl shadow-indigo-500/30 flex items-center gap-2">
        <i data-lucide="upload-cloud" class="h-4 w-4"></i>
        <span>Tải Tải Liệu Mới</span>
      </a>
    </div>

    <!-- Filters & Search -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="flex-1 relative">
        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Tìm kiếm tài liệu theo tên..."
          class="input-3d w-full pl-12 pr-4 py-3 text-sm font-semibold placeholder-slate-400"
        />
      </div>
      <div class="flex items-center gap-2.5" id="filterContainer">
        <button onclick="setFilter('ALL')" class="filter-btn btn-3d btn-3d-primary px-4 py-2.5 text-xs font-bold">ALL</button>
        <button onclick="setFilter('PDF')" class="filter-btn btn-3d btn-3d-secondary px-4 py-2.5 text-xs font-bold">PDF</button>
        <button onclick="setFilter('DOCX')" class="filter-btn btn-3d btn-3d-secondary px-4 py-2.5 text-xs font-bold">DOCX</button>
        <button onclick="setFilter('PPTX')" class="filter-btn btn-3d btn-3d-secondary px-4 py-2.5 text-xs font-bold">PPTX</button>
      </div>
    </div>

    <!-- Documents Grid -->
    <div id="docsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Dynamically filled -->
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderUnifiedSidebar("documents");
    lucide.createIcons();

    let allDocs = [];
    let activeFilter = "ALL";
    const searchInput = document.getElementById("searchInput");

    async function loadDocuments() {
      try {
        const response = await fetch("/api/documents");
        if (response.ok) {
          allDocs = await response.json();
          renderDocs();
        }
      } catch (err) {
        console.error("Lỗi nạp tài liệu:", err);
      }
    }

    function renderDocs() {
      const query = searchInput.value.toLowerCase();
      const grid = document.getElementById("docsGrid");
      grid.innerHTML = "";

      const filtered = allDocs.filter(doc => {
        const matchesSearch = (doc.title || "").toLowerCase().includes(query);
        const matchesFilter = activeFilter === "ALL" || doc.format === activeFilter;
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full glass-3d-card p-12 text-center text-slate-500 font-semibold">
            <i data-lucide="folder-open" class="h-12 w-12 text-slate-400 mx-auto mb-3"></i>
            Không tìm thấy tài liệu nào phù hợp.
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(doc => {
        const card = document.createElement("div");
        card.className = "glass-3d-card p-6 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-4">
              <div class="flex items-center gap-3.5">
                <div class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-2 rounded-xl font-extrabold font-mono text-xs shadow-sm">
                  ${doc.format || 'PDF'}
                </div>
                <div>
                  <h3 class="font-extrabold text-base text-slate-900 hover:text-indigo-600 transition-colors">
                    <a href="detail.html?id=${doc.id}">${doc.title}</a>
                  </h3>
                  <p class="text-xs text-slate-500 mt-1 font-medium">${doc.size || '2.4 MB'} • ${doc.pages || 12} trang</p>
                </div>
              </div>
              <span class="badge-3d badge-3d-emerald">
                <i data-lucide="check-circle" class="h-3.5 w-3.5"></i> Sẵn sàng
              </span>
            </div>
            <div class="text-xs text-slate-500 font-semibold mb-6">Đã tải lên: ${doc.uploadDate || 'Gần đây'}</div>
          </div>
          <div class="flex items-center justify-between border-t border-slate-200/80 pt-4">
            <div class="flex gap-2">
              <a href="detail.html?id=${doc.id}" class="btn-3d btn-3d-secondary px-3 py-1.5 text-xs font-bold">Chi tiết</a>
              <a href="viewer.html?id=${doc.id}" class="btn-3d btn-3d-primary px-3 py-1.5 text-xs font-bold"><i data-lucide="book-open" class="h-3.5 w-3.5"></i> Đọc</a>
              <a href="map.html?id=${doc.id}" class="btn-3d btn-3d-secondary px-3 py-1.5 text-xs font-bold"><i data-lucide="network" class="h-3.5 w-3.5"></i> Sơ đồ 3D</a>
            </div>
            <button onclick="deleteDoc(${doc.id})" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all" title="Xóa tài liệu">
              <i data-lucide="trash-2" class="h-4 w-4"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    async function deleteDoc(id) {
      if (!confirm("Bạn có chắc chắn muốn xóa tài liệu này?")) return;
      try {
        const response = await fetch("/api/documents/" + id, { method: "DELETE" });
        if (response.ok) {
          allDocs = allDocs.filter(d => d.id !== id);
          renderDocs();
        }
      } catch (err) {
        console.error("Lỗi xóa tài liệu:", err);
      }
    }

    function setFilter(type) {
      activeFilter = type;
      const buttons = document.querySelectorAll(".filter-btn");
      buttons.forEach(btn => {
        if (btn.textContent.trim() === type) {
          btn.className = "filter-btn btn-3d btn-3d-primary px-4 py-2.5 text-xs font-bold";
        } else {
          btn.className = "filter-btn btn-3d btn-3d-secondary px-4 py-2.5 text-xs font-bold";
        }
      });
      renderDocs();
    }

    searchInput.addEventListener("input", renderDocs);
    loadDocuments();
  </script>
</body>
</html>
