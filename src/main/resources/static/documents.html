<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Documents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900/80 backdrop-blur-md border-r border-slate-800 text-slate-200 flex flex-col justify-between p-4 sticky top-0 h-screen z-20">
    <div>
      <div class="flex items-center gap-2 px-2 py-4 mb-6">
        <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="sparkles" class="h-6 w-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Study AI</h1>
          <span class="text-xs text-slate-500 font-medium">Assistant Hub</span>
        </div>
      </div>

      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
          Bảng điều khiển
        </a>
        <a href="documents.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-indigo-600/20 text-indigo-400 border-l-4 border-indigo-500 pl-2.5 transition-all">
          <i data-lucide="file-text" class="h-5 w-5"></i>
          Tài liệu
        </a>
        <a href="map.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="network" class="h-5 w-5"></i>
          Sơ đồ kiến thức
        </a>
        <a href="viewer.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-202 hover:bg-slate-900 transition-all">
          <i data-lucide="message-square" class="h-5 w-5"></i>
          <span>Hỏi đáp AI</span>
        </a>
        <a href="flashcards.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="book-open" class="h-5 w-5"></i>
          Thẻ ghi nhớ
        </a>
        <a href="quiz.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="help-circle" class="h-5 w-5"></i>
          Trắc nghiệm
        </a>
        <a href="progress.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="bar-chart-3" class="h-5 w-5"></i>
          Tiến độ học tập
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="user" class="h-5 w-5"></i>
          Thông tin cá nhân
        </a>
        <a href="admin.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all">
          <i data-lucide="shield-alert" class="h-5 w-5"></i>
          Quản trị viên
        </a>
      </nav>
    </div>

    <div class="border-t border-slate-800 pt-4 mt-auto">
      <div class="flex items-center gap-3 px-2 py-2 mb-3 bg-slate-900/40 rounded-xl border border-slate-800/40">
        <div class="w-9 h-9 rounded-full bg-indigo-650 text-white flex items-center justify-center font-bold shadow-md">JD</div>
        <div class="flex-1 min-w-0">
          <p id="userNameLabel" class="text-xs font-semibold text-slate-200 truncate">John Doe</p>
          <p id="userEmailLabel" class="text-[10px] text-slate-500 truncate">john.doe@example.com</p>
        </div>
      </div>
      <a href="login.html" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-all duration-200">
        <i data-lucide="log-out" class="h-4 w-4"></i>
        Đăng xuất
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-slate-100 to-slate-300 bg-clip-text text-transparent">Tài liệu của tôi</h1>
        <p class="text-slate-400 mt-1">Manage and access all uploaded research materials</p>
      </div>
      <a href="upload.html" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-500/20 transition-all duration-150">
        Upload New File
      </a>
    </div>

    <!-- Filters & Search -->
    <div class="flex flex-col sm:flex-row gap-4 mb-6">
      <div class="flex-1 relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Search documents..."
          class="w-full bg-slate-900/50 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        />
      </div>
      <div class="flex items-center gap-2" id="filterContainer">
        <button onclick="setFilter('ALL')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-indigo-500/50 bg-indigo-600/20 text-indigo-400 transition-all">ALL</button>
        <button onclick="setFilter('PDF')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-800 text-slate-400 hover:bg-slate-900 transition-all">PDF</button>
        <button onclick="setFilter('DOCX')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-800 text-slate-400 hover:bg-slate-900 transition-all">DOCX</button>
        <button onclick="setFilter('PPTX')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-800 text-slate-400 hover:bg-slate-900 transition-all">PPTX</button>
      </div>
    </div>

    <!-- Documents Grid -->
    <div id="docsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Dynamically filled -->
    </div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (!user.id) {
      window.location.href = "login.html";
    }

    document.getElementById("userNameLabel").textContent = user.name || "Guest";
    document.getElementById("userEmailLabel").textContent = user.email || "guest@example.com";

    
    // Hide Admin sidebar link if not ADMIN
    const adminLink = document.querySelector('a[href="admin.html"]');
    if (adminLink && (user.role || "FREE").toUpperCase() !== "ADMIN") {
      adminLink.remove();
    }
    lucide.createIcons();

    let allDocs = [];
    let activeFilter = "ALL";
    const searchInput = document.getElementById("searchInput");

    async function loadDocuments() {
      try {
        const response = await fetch("/api/documents");
        if (response.ok) {
          allDocs = await response.json();
          renderDocs();
        }
      } catch (err) {
        console.error("Failed to load documents", err);
      }
    }

    function renderDocs() {
      const query = searchInput.value.toLowerCase();
      const grid = document.getElementById("docsGrid");
      grid.innerHTML = "";

      const filtered = allDocs.filter(doc => {
        const matchesSearch = doc.title.toLowerCase().includes(query);
        const matchesFilter = activeFilter === "ALL" || doc.format === activeFilter;
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-slate-500 text-sm py-12 text-center">No documents match the filters or query.</div>`;
        return;
      }

      filtered.forEach(doc => {
        const card = document.createElement("div");
        card.className = "bg-slate-900/40 backdrop-blur-sm border border-slate-800/80 rounded-2xl p-6 flex flex-col justify-between hover:border-slate-700/80 transition-all";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-4">
              <div class="flex items-center gap-3">
                <div class="bg-indigo-950 text-indigo-400 border border-indigo-900 p-2.5 rounded-xl font-bold font-mono text-xs">
                  ${doc.format}
                </div>
                <div>
                  <h3 class="font-bold text-slate-200">${doc.title}</h3>
                  <p class="text-xs text-slate-500 mt-1">${doc.size} • ${doc.pages} pages</p>
                </div>
              </div>
              <span class="flex items-center gap-1 text-[11px] font-semibold text-emerald-450 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
                <i data-lucide="check-circle-2" class="h-3 w-3"></i> Ready
              </span>
            </div>
            <div class="text-xs text-slate-500 mb-6 mt-2">Uploaded on ${doc.uploadDate}</div>
          </div>
          <div class="flex items-center justify-between border-t border-slate-800/80 pt-4">
            <div class="flex gap-2">
              <a href="detail.html?id=${doc.id}" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-lg text-xs font-semibold text-slate-350 transition-all">Details</a>
              <a href="viewer.html?id=${doc.id}" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-lg text-xs font-semibold text-indigo-400 transition-all"><i data-lucide="external-link" class="h-3 w-3"></i> Read</a>
              <a href="map.html?id=${doc.id}" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-lg text-xs font-semibold text-indigo-400 transition-all"><i data-lucide="network" class="h-3 w-3"></i> Map</a>
            </div>
            <button onclick="deleteDoc(${doc.id})" class="p-2 text-slate-500 hover:text-rose-455 hover:bg-rose-500/10 rounded-lg transition-all" title="Delete document">
              <i data-lucide="trash-2" class="h-4 w-4"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    async function deleteDoc(id) {
      if (!confirm("Are you sure you want to delete this document?")) return;
      try {
        const response = await fetch("/api/documents/" + id, {
          method: "DELETE"
        });
        if (response.ok) {
          allDocs = allDocs.filter(d => d.id !== id);
          renderDocs();
        }
      } catch (err) {
        console.error("Failed to delete document", err);
      }
    }

    function setFilter(type) {
      activeFilter = type;
      const buttons = document.querySelectorAll(".filter-btn");
      buttons.forEach(btn => {
        if (btn.textContent === type) {
          btn.className = "filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-indigo-500/50 bg-indigo-600/20 text-indigo-400 transition-all";
        } else {
          btn.className = "filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-800 text-slate-400 hover:bg-slate-900 transition-all";
        }
      });
      renderDocs();
    }

    searchInput.addEventListener("input", renderDocs);
    loadDocuments();
  </script>
</body>
</html>
