<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Bài Thi Trắc Nghiệm 3D AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto flex flex-col items-center relative z-10">
    <div class="w-full max-w-3xl">
      <!-- Header -->
      <div class="flex justify-between items-center mb-8 w-full">
        <div class="flex items-center gap-4">
          <a id="backLink" href="documents.html" class="btn-3d btn-3d-secondary p-3 text-slate-700">
            <i data-lucide="arrow-left" class="h-5 w-5"></i>
          </a>
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
              Phòng Thi Trắc Nghiệm AI 3D
            </h1>
            <p class="text-xs text-slate-600 mt-1 font-semibold">Đánh giá khả năng làm chủ kiến thức từ tài liệu đã chọn</p>
          </div>
        </div>
        <div class="badge-3d badge-3d-indigo py-2 px-4 text-xs font-extrabold">
          <i data-lucide="clock" class="h-4 w-4 text-indigo-600 animate-spin"></i> 09:45
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full mb-8 glass-3d-card p-4">
        <div class="flex justify-between text-xs font-extrabold text-slate-700 mb-2">
          <span id="questionCountLabel" class="text-indigo-700">Câu 1 / 3</span>
          <span id="completeLabel" class="text-emerald-700">0% Hoàn thành</span>
        </div>
        <div class="w-full bg-slate-200 border border-slate-300 h-3 rounded-full overflow-hidden p-0.5">
          <div id="progressBar" class="bg-gradient-to-r from-indigo-600 to-cyan-500 h-full rounded-full transition-all duration-300 w-1/3 shadow-sm"></div>
        </div>
      </div>

      <!-- Question Box -->
      <div class="glass-3d-card p-8 mb-8">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 border border-indigo-200 flex items-center justify-center shadow-md shrink-0">
            <i data-lucide="help-circle" class="h-6 w-6"></i>
          </div>
          <h2 id="questionText" class="text-xl font-bold text-slate-900 leading-snug">
            Minsky và Papert đã chứng minh Perceptron đơn tầng không thể giải quyết hàm số nào?
          </h2>
        </div>

        <div id="optionsContainer" class="mt-8 space-y-4">
          <!-- Dynamic options A, B, C, D -->
        </div>
      </div>

      <!-- Controls -->
      <div class="flex justify-between gap-4">
        <button onclick="prevQuestion()" id="prevBtn" class="btn-3d btn-3d-secondary py-3.5 px-6 text-sm font-bold flex-1 disabled:opacity-40">
          <i data-lucide="chevron-left" class="h-5 w-5"></i> Câu Trước
        </button>
        <button onclick="nextQuestion()" id="nextBtn" class="btn-3d btn-3d-primary py-3.5 px-6 text-sm font-bold shadow-xl shadow-indigo-500/30 flex-1">
          Câu Tiếp theo <i data-lucide="chevron-right" class="h-5 w-5"></i>
        </button>
        <button onclick="submitQuiz()" id="submitBtn" class="hidden btn-3d btn-3d-primary py-3.5 px-6 text-sm font-bold shadow-xl shadow-emerald-500/30 flex-1 !bg-emerald-600 hover:!bg-emerald-500">
          Nộp Bài Thi AI <i data-lucide="check-circle" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderUnifiedSidebar("quiz");

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id") || "1";
    document.getElementById("backLink").href = `detail.html?id=${docId}`;

    let questions = [
      { id: 1, question: "Minsky và Papert đã chứng minh Perceptron đơn tầng không thể giải quyết hàm số nào?", options: ["Cổng AND", "Cổng OR", "Cổng XOR", "Cổng NOT"], answer: 2 },
      { id: 2, question: "Hàm kích hoạt nào xuất kết quả nằm trong khoảng từ 0 đến 1?", options: ["ReLU", "Sigmoid", "Tanh", "Leaky ReLU"], answer: 1 },
      { id: 3, question: "Trong huấn luyện mạng neuron, thuật toán nào tính đạo hàm của độ lỗi theo trọng số?", options: ["Forward propagation", "Backpropagation", "Bias calculation", "Pooling"], answer: 1 }
    ];

    let currentIndex = 0;
    let selectedAnswers = {};

    async function loadQuiz() {
      try {
        const resTopics = await fetch(`/api/topics/document/${docId}`);
        if (resTopics.ok) {
          const topics = await resTopics.json();
          if (topics.length > 0) {
            const topicId = topics[0].children && topics[0].children.length > 0 ? topics[0].children[0].id : topics[0].id;
            const resQuizzes = await fetch(`/api/quizzes/topic/${topicId}`);
            if (resQuizzes.ok) {
              const quizzes = await resQuizzes.json();
              if (quizzes.length > 0) {
                const resQuestions = await fetch(`/api/quizzes/${quizzes[0].id}/questions`);
                if (resQuestions.ok) {
                  const serverQs = await resQuestions.json();
                  if (serverQs.length > 0) {
                    questions = serverQs.map(q => ({
                      id: q.id,
                      question: q.question,
                      options: [q.optionA, q.optionB, q.optionC, q.optionD],
                      answer: q.correctAnswer
                    }));
                  }
                }
              }
            }
          }
        }
      } catch (err) {
        console.error("Lỗi nạp bài thi từ máy chủ, dùng dữ liệu mẫu", err);
      }
      updateQuestionDisplay();
    }

    function updateQuestionDisplay() {
      if (questions.length === 0) return;
      const q = questions[currentIndex];
      document.getElementById("questionText").textContent = q.question;
      document.getElementById("questionCountLabel").textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
      
      const completePct = Math.round((Object.keys(selectedAnswers).length / questions.length) * 100);
      document.getElementById("completeLabel").textContent = `${completePct}% Hoàn thành`;
      document.getElementById("progressBar").style.width = ((currentIndex + 1) / questions.length) * 100 + "%";

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const optionLetters = ["A", "B", "C", "D"];
      q.options.forEach((opt, idx) => {
        const isSelected = selectedAnswers[q.id] === idx;
        const btn = document.createElement("button");
        btn.onclick = () => selectOption(idx);
        btn.className = `w-full flex items-center justify-between p-4 rounded-2xl text-sm font-semibold border transition-all text-left ${
          isSelected
            ? "border-indigo-500 bg-indigo-50 text-indigo-900 shadow-md ring-2 ring-indigo-400"
            : "border-slate-200 bg-white hover:bg-slate-50 text-slate-700"
        }`;
        btn.innerHTML = `
          <div class="flex items-center gap-3.5">
            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${
              isSelected ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 border border-slate-300'
            }">${optionLetters[idx]}</span>
            <span class="text-sm font-bold">${opt}</span>
          </div>
          ${isSelected ? '<i data-lucide="check-circle-2" class="h-5 w-5 text-indigo-600"></i>' : ''}
        `;
        container.appendChild(btn);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      if (currentIndex === questions.length - 1) {
        document.getElementById("nextBtn").classList.add("hidden");
        document.getElementById("submitBtn").classList.remove("hidden");
      } else {
        document.getElementById("nextBtn").classList.remove("hidden");
        document.getElementById("submitBtn").classList.add("hidden");
      }

      lucide.createIcons();
    }

    function selectOption(index) {
      const q = questions[currentIndex];
      selectedAnswers[q.id] = index;
      updateQuestionDisplay();
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        updateQuestionDisplay();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        updateQuestionDisplay();
      }
    }

    function submitQuiz() {
      let score = 0;
      questions.forEach(q => {
        if (selectedAnswers[q.id] === q.answer) {
          score++;
        }
      });
      window.location.href = `result.html?score=${score}&total=${questions.length}&id=${docId}`;
    }

    loadQuiz();
  </script>
</body>
</html>
