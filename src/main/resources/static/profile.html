<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Hồ Sơ Cá Nhân 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto relative z-10">
    <div class="max-w-4xl mx-auto">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900" data-i18n="profile_title">
          Hồ Sơ Cá Nhân
        </h1>
        <p class="text-slate-600 text-sm mt-1.5 font-semibold" data-i18n="profile_sub">Quản lý thông tin tài khoản, mật khẩu và cài đặt trải nghiệm 3D</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Avatar Card -->
        <div class="glass-3d-card p-6 text-center flex flex-col items-center">
          <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 via-purple-600 to-cyan-500 rounded-3xl flex items-center justify-center font-extrabold text-3xl text-white shadow-2xl ring-4 ring-white">
            AI
          </div>
          <h3 id="profileNameLabel" class="font-extrabold text-xl text-slate-900 mt-5">Học Viên AI</h3>
          <p id="profileEmailLabel" class="text-xs text-slate-500 mt-1 font-semibold">user@study.ai</p>
          
          <div class="w-full border-t border-slate-200 mt-6 pt-6 space-y-3.5">
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-600 font-extrabold" data-i18n="profile_role">Vai trò:</span>
              <span id="roleLabel" class="badge-3d badge-3d-indigo">Học sinh</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-600 font-extrabold">Gói dịch vụ:</span>
              <span id="tierLabel" class="badge-3d badge-3d-emerald">GÓI PRO 3D</span>
            </div>
          </div>

          <a href="payment.html" class="mt-8 w-full btn-3d btn-3d-primary py-3 text-xs font-bold shadow-lg shadow-indigo-500/30">
            Nâng Cấp Gói PRO
          </a>
        </div>

        <!-- Form Edit Info -->
        <div class="md:col-span-2 glass-3d-card p-8">
          <h3 class="text-lg font-extrabold text-slate-900 mb-6 flex items-center gap-2">
            <i data-lucide="user-check" class="h-5 w-5 text-indigo-600"></i> Cập Nhật Thông Tin Tùy Chỉnh
          </h3>
          <form id="profileForm" class="space-y-5">
            <div>
              <label for="fullNameInput" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">Họ và Tên</label>
              <input type="text" id="fullNameInput" class="input-3d w-full font-semibold" placeholder="Nguyễn Văn A" />
            </div>

            <div>
              <label for="emailInput" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">Địa chỉ Email</label>
              <input type="email" id="emailInput" class="input-3d w-full font-semibold" placeholder="email@example.com" />
            </div>

            <button type="submit" class="btn-3d btn-3d-primary py-3 px-6 text-xs font-bold shadow-lg shadow-indigo-500/30">
              Lưu Thay Đổi
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="sidebar.js"></script>
  <script src="i18n.js"></script>
  <script>
    renderUnifiedSidebar("profile");
    lucide.createIcons();

    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (user) {
      document.getElementById("profileNameLabel").textContent = user.name || user.username || "Học Viên AI";
      document.getElementById("profileEmailLabel").textContent = user.email || "user@study.ai";
      document.getElementById("fullNameInput").value = user.name || user.username || "";
      document.getElementById("emailInput").value = user.email || "";
      if (document.getElementById("roleLabel")) document.getElementById("roleLabel").textContent = user.role || "FREE";
    }
  </script>
</body>
</html>
