<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Sơ Đồ Kiến Thức 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
  <link rel="stylesheet" href="css/feature-ui.css">
  <link rel="stylesheet" href="css/mind-map-renderer.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto flex flex-col relative z-10">
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-4">
        <a id="backBtn" href="viewer.html" class="btn-3d btn-3d-secondary p-3 text-slate-700" title="Trở về Trợ lý Chat AI">
          <i data-lucide="arrow-left" class="h-5 w-5"></i>
        </a>
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
            Sơ Đồ Tư Duy Kiến Thức 3D
          </h1>
          <p class="text-xs text-slate-600 mt-1 font-semibold">Chọn khái niệm, mở hoặc thu nhánh để khám phá tài liệu.</p>
        </div>
      </div>
    </div>

    <div class="flex-1 flex flex-col gap-6 min-h-[580px]">
      <!-- Mind Map Canvas: sơ đồ phân nhánh thật (đường cong SVG), có zoom/pan,
           màu theo cấp độ, nút mở/thu từng nhánh -->
      <div class="glass-3d-card p-4 md:p-6 flex flex-col" style="min-height: 560px;">
        <div class="flex items-center justify-between mb-3 border-b border-slate-200 pb-3 flex-shrink-0">
          <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="network" class="h-4 w-4 text-indigo-600"></i> Sơ Đồ Tư Duy
          </h3>

        </div>

        <div id="mapNodes" class="flex-1 min-h-0 overflow-y-auto"></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass-3d-card p-6 flex flex-col justify-between">
          <div>
            <span class="badge-3d badge-3d-indigo text-[10px]">Chi Tiết Khái Niệm Đang Chọn</span>
            <h4 id="activeLabel" class="font-extrabold text-base text-slate-900 mt-2.5">Chọn một chủ đề để xem chi tiết</h4>
            <p id="activeDesc" class="text-xs text-slate-700 mt-1.5 leading-relaxed font-semibold">Click vào 1 nhánh trong sơ đồ phía trên để xem trang tương ứng.</p>
          </div>
        </div>

        <!-- Right PDF Panel: nhúng thẳng trình đọc PDF thật (reader.html), nhảy
             đúng trang thật khi bấm vào 1 chủ đề trong sơ đồ -->
        <div class="glass-3d-card rounded-3xl overflow-hidden flex flex-col lg:col-span-2">
          <div class="bg-white/90 border-b border-slate-200 p-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
              <i data-lucide="book-open" class="h-4 w-4 text-indigo-600"></i>
              <span id="pageReaderLabel" class="text-xs font-extrabold text-slate-900">Trình Đọc Tài Liệu</span>
            </div>
            <a id="openFullReaderLink" href="#" target="_blank" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
              Mở toàn màn hình <i data-lucide="external-link" class="h-3 w-3"></i>
            </a>
          </div>

          <div class="flex-1 min-h-[320px]">
            <iframe id="readerFrame" class="w-full h-full min-h-[320px] border-0" title="Trình đọc tài liệu"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/document-ui.js"></script>
  <script src="js/document-features.js"></script>
  <script src="sidebar.js"></script>
  <script src="js/document-mind-map.js"></script>
  <script src="js/mind-map-renderer.js"></script>
  <script src="citations.js"></script>
  <script>
    renderUnifiedSidebar("map");
    const docId = new URLSearchParams(location.search).get("id");
    const box = document.getElementById("mapNodes");
    document.getElementById("backBtn").href = `viewer.html?id=${encodeURIComponent(docId || '')}`;
    let loading = false, pollTimer;
    async function loadTopics(retry = false) {
      if (loading) return; loading = true;
      DocumentUI.setBusy(box, true); DocumentUI.notice(box, "Đang nạp sơ đồ tư duy...");
      try {
        if (!/^\d+$/.test(docId || '')) throw Object.assign(new Error(), { status: 404 });
        const doc = await ApiClient.get(`/api/documents/${docId}`);
        if (!DocumentUI.ready(doc)) {
          DocumentUI.notice(box, DocumentUI.message(doc), () => loadTopics());
          if (DocumentUI.state(doc) === 'PROCESSING') pollTimer = setTimeout(() => loadTopics(), 3000);
          return;
        }
        const graph = await DocumentMindMap.load(doc, retry);
        if (!graph.nodes.length) { DocumentUI.notice(box, "Chưa có khái niệm có bằng chứng.", () => loadTopics(true)); return; }
        MindMapRenderer.render(box, graph, undefined, 0, { onRegenerate: () => loadTopics(true), onSelect: node => {
          document.getElementById("activeLabel").textContent = node.name || node.canonicalName;
          document.getElementById("activeDesc").textContent = node.description || "Chưa có mô tả.";
          const source = node.sources?.[0];
          const location = citationLocation(source || { documentId: docId }, docId) || citationLocation({ documentId: docId }, docId);
          document.getElementById("pageReaderLabel").textContent = source?.pageStart ? `Trang ${source.pageStart}` : "Trình đọc tài liệu — chưa có vị trí trang";
          document.getElementById("openFullReaderLink").href = location.href;
          const reader = document.getElementById("readerFrame");
          const next = location.href + '&embedded=1'; if (reader.getAttribute('src') !== next) reader.src = next;
        } });
        DocumentMindMap.showStatus(box, graph);
      } catch (error) { DocumentUI.notice(box, DocumentUI.errorMessage(error), () => loadTopics(true)); }
      finally { loading = false; DocumentUI.setBusy(box, false); }
    }
    window.addEventListener('pagehide', () => clearTimeout(pollTimer));
    loadTopics(); lucide.createIcons();
  </script>
</body>
</html>
