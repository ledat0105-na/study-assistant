<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">

  <!-- Background Glows -->
  <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-[500px] h-[500px] bg-purple-500/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="flex justify-center mb-6">
      <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-3 rounded-2xl text-white shadow-xl shadow-indigo-500/20">
        <i data-lucide="sparkles" class="h-8 w-8 animate-pulse"></i>
      </div>
    </div>
    <h2 class="text-center text-3xl font-extrabold bg-gradient-to-r from-slate-100 via-indigo-100 to-purple-100 bg-clip-text text-transparent">
      Welcome back
    </h2>
    <p class="mt-2 text-center text-sm text-slate-400">
      Or
      <a href="register.html" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">
        create a new account
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10 px-4">
    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 py-8 px-6 shadow-2xl rounded-2xl sm:px-10">
      <form id="loginForm" class="space-y-6">
        <div id="errorAlert" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold p-3 rounded-xl"></div>

        <div>
          <label for="usernameOrEmail" class="block text-sm font-medium text-slate-300">
            Tên đăng nhập or Địa chỉ Email
          </label>
          <div class="mt-1.5 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="mail" class="h-5 w-5"></i>
            </div>
            <input
              id="usernameOrEmail"
              type="text"
              required
              class="block w-full pl-10 pr-3 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 text-sm transition-all"
              placeholder="username or email"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300">
            Mật khẩu
          </label>
          <div class="mt-1.5 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="h-5 w-5"></i>
            </div>
            <input
              id="password"
              type="password"
              required
              class="block w-full pl-10 pr-3 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 text-sm transition-all"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all duration-150"
        >
          Đăng nhập
          <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const usernameOrEmail = document.getElementById("usernameOrEmail").value;
      const password = document.getElementById("password").value;
      const errorAlert = document.getElementById("errorAlert");

      errorAlert.classList.add("hidden");

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ usernameOrEmail, password })
        });

        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("user", JSON.stringify(data));
          window.location.href = "dashboard.html";
        } else {
          errorAlert.textContent = data.error || "Login failed";
          errorAlert.classList.remove("hidden");
        }
      } catch (err) {
        errorAlert.textContent = "Server connection error";
        errorAlert.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
