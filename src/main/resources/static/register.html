<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">

  <!-- Background Glows -->
  <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-[500px] h-[500px] bg-purple-500/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="flex justify-center mb-6">
      <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-3 rounded-2xl text-white shadow-xl shadow-indigo-500/20">
        <i data-lucide="sparkles" class="h-8 w-8 animate-pulse"></i>
      </div>
    </div>
    <h2 class="text-center text-3xl font-extrabold bg-gradient-to-r from-slate-100 via-indigo-100 to-purple-100 bg-clip-text text-transparent">
      Create account
    </h2>
    <p class="mt-2 text-center text-sm text-slate-400">
      Đã có tài khoản?
      <a href="login.html" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">
        Sign in
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10 px-4">
    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 py-8 px-6 shadow-2xl rounded-2xl sm:px-10">
      <form id="registerForm" class="space-y-4">
        <div id="errorAlert" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold p-3 rounded-xl font-sans"></div>

        <div>
          <label for="name" class="block text-sm font-medium text-slate-300">
            Full name
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="h-5 w-5"></i>
            </div>
            <input
              id="name"
              type="text"
              required
              class="block w-full pl-10 pr-3 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm transition-all"
              placeholder="John Doe"
            />
          </div>
        </div>

        <div>
          <label for="username" class="block text-sm font-medium text-slate-300">
            Tên đăng nhập
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="h-5 w-5"></i>
            </div>
            <input
              id="username"
              type="text"
              required
              class="block w-full pl-10 pr-3 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm transition-all"
              placeholder="johndoe"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-300">
            Địa chỉ Email
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="mail" class="h-5 w-5"></i>
            </div>
            <input
              id="email"
              type="email"
              required
              class="block w-full pl-10 pr-3 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-550 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm transition-all"
              placeholder="name@example.com"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300">
            Mật khẩu
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="h-5 w-5"></i>
            </div>
            <input
              id="password"
              type="password"
              required
              class="block w-full pl-10 pr-3 py-2 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm transition-all"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div>
          <label for="confirmMật khẩu" class="block text-sm font-medium text-slate-300">
            Confirm Mật khẩu
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="shield-check" class="h-5 w-5"></i>
            </div>
            <input
              id="confirmMật khẩu"
              type="password"
              required
              class="block w-full pl-10 pr-3 py-2 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-550 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm transition-all"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Vai trò</label>
          <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              id="roleHọc sinh"
              class="py-2 px-4 rounded-xl text-sm font-medium border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition-all"
            >
              Học sinh
            </button>
            <button
              type="button"
              id="roleGiảng viên"
              class="py-2 px-4 rounded-xl text-sm font-medium border border-slate-800 bg-slate-950/40 text-slate-400 hover:border-slate-700 transition-all"
            >
              Giảng viên
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition-all duration-150"
        >
          Đăng ký
          <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let selectedVai trò = "student";
    const roleHọc sinh = document.getElementById("roleHọc sinh");
    const roleGiảng viên = document.getElementById("roleGiảng viên");

    roleHọc sinh.addEventListener("click", () => {
      selectedVai trò = "student";
      roleHọc sinh.className = "py-2 px-4 rounded-xl text-sm font-medium border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition-all";
      roleGiảng viên.className = "py-2 px-4 rounded-xl text-sm font-medium border border-slate-800 bg-slate-900/40 text-slate-400 hover:border-slate-700 transition-all";
    });

    roleGiảng viên.addEventListener("click", () => {
      selectedVai trò = "educator";
      roleGiảng viên.className = "py-2 px-4 rounded-xl text-sm font-medium border border-indigo-500 bg-indigo-500/10 text-indigo-400 transition-all";
      roleHọc sinh.className = "py-2 px-4 rounded-xl text-sm font-medium border border-slate-800 bg-slate-900/40 text-slate-400 hover:border-slate-700 transition-all";
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmMật khẩu = document.getElementById("confirmMật khẩu").value;
      const errorAlert = document.getElementById("errorAlert");

      errorAlert.classList.add("hidden");

      if (password !== confirmMật khẩu) {
        errorAlert.textContent = "Mật khẩus do not match!";
        errorAlert.classList.remove("hidden");
        return;
      }

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, username, email, password, role: selectedVai trò.toUpperCase() })
        });

        const data = await response.json();
        if (response.ok) {
          window.location.href = "login.html";
        } else {
          errorAlert.textContent = data.error || "Registration failed";
          errorAlert.classList.remove("hidden");
        }
      } catch (err) {
        errorAlert.textContent = "Server connection error";
        errorAlert.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
