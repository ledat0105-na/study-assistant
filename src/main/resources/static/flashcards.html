<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI - Thẻ Ghi Nhớ 3D Active Recall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style-3d.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex relative overflow-x-hidden">

  <!-- 3D Sidebar -->
  <aside></aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto flex flex-col items-center relative z-10">
    <div class="w-full max-w-3xl">
      <div class="flex justify-between items-center mb-8 w-full">
        <div class="flex items-center gap-4">
          <a id="backLink" href="documents.html" class="btn-3d btn-3d-secondary p-3 text-slate-700">
            <i data-lucide="arrow-left" class="h-5 w-5"></i>
          </a>
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
              Thẻ Ghi Nhớ Lật 3D
            </h1>
            <p class="text-xs text-slate-600 mt-1 font-semibold">Ghi nhớ chủ động (Active Recall) tối ưu não bộ</p>
          </div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full mb-8 glass-3d-card p-4">
        <div class="flex justify-between text-xs font-extrabold text-slate-700 mb-2">
          <span>Tiến Độ Lật Thẻ</span>
          <span id="progressText" class="text-indigo-600">1 / 4 Thẻ</span>
        </div>
        <div class="w-full bg-slate-200 border border-slate-300 h-3 rounded-full overflow-hidden p-0.5">
          <div id="progressBar" class="bg-gradient-to-r from-indigo-600 to-purple-600 h-full rounded-full transition-all duration-300 w-1/4 shadow-sm"></div>
        </div>
      </div>

      <!-- 3D Flashcard Component -->
      <div class="flashcard-3d-wrapper mb-8" onclick="flipCard()">
        <div id="flashCardInner" class="flashcard-3d-inner">
          
          <!-- Front Side -->
          <div class="flashcard-3d-front">
            <div class="flex justify-between items-center w-full">
              <span class="badge-3d badge-3d-indigo">KHÁI NIỆM</span>
              <i data-lucide="sparkles" class="h-5 w-5 text-indigo-600 animate-pulse"></i>
            </div>
            
            <div class="my-auto text-center px-4">
              <h2 id="cardFront" class="text-3xl font-extrabold tracking-tight text-slate-900 drop-shadow-sm">Perceptron</h2>
            </div>
            
            <div class="flex justify-center w-full">
              <span class="inline-flex items-center gap-2 text-xs font-extrabold text-slate-600 bg-slate-100 border border-slate-300 px-4 py-2 rounded-xl">
                <i data-lucide="rotate-3d" class="h-4 w-4 text-indigo-600"></i> Bấm để lật xem định nghĩa
              </span>
            </div>
          </div>

          <!-- Back Side -->
          <div class="flashcard-3d-back">
            <div class="flex justify-between items-center w-full">
              <span class="badge-3d badge-3d-emerald">ĐỊNH NGHĨA CHI TIẾT</span>
              <i data-lucide="star" class="h-5 w-5 text-amber-500 fill-amber-500"></i>
            </div>
            
            <div class="my-auto text-center px-4">
              <p id="cardBack" class="text-lg font-bold text-indigo-950 leading-relaxed max-w-xl mx-auto">
                Mô hình neuron nhân tạo đơn tầng được sử dụng làm bộ phân loại nhị phân.
              </p>
            </div>

            <div class="flex justify-center w-full">
              <span class="inline-flex items-center gap-2 text-xs font-extrabold text-indigo-700 bg-white/80 border border-indigo-200 px-4 py-2 rounded-xl shadow-sm">
                <i data-lucide="rotate-3d" class="h-4 w-4"></i> Bấm để quay lại câu hỏi
              </span>
            </div>
          </div>

        </div>
      </div>

      <!-- Controls -->
      <div class="flex justify-between gap-4">
        <button onclick="prevCard()" class="btn-3d btn-3d-secondary py-3.5 px-6 text-sm font-bold flex-1">
          <i data-lucide="chevron-left" class="h-5 w-5"></i> Thẻ Trước
        </button>
        <button onclick="nextCard()" class="btn-3d btn-3d-primary py-3.5 px-6 text-sm font-bold shadow-xl shadow-indigo-500/30 flex-1">
          Thẻ Tiếp Theo <i data-lucide="chevron-right" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </main>

  <script src="auth-interceptor.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderUnifiedSidebar("flashcards");

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id") || "1";
    document.getElementById("backLink").href = `detail.html?id=${docId}`;

    let flashcards = [
      { id: 1, front: "Perceptron", back: "Mô hình neuron nhân tạo đơn tầng dùng làm bộ phân loại nhị phân tính tổng có trọng số của đầu vào." },
      { id: 2, front: "Hàm Kích Hoạt (Activation Function)", back: "Hàm toán học giúp mạng neuron học các mẫu hình phi tuyến tính phức tạp." },
      { id: 3, front: "Lan Truyền Ngược (Backpropagation)", back: "Thuật toán huấn luyện mạng neuron bằng cách tính đạo hàm độ lỗi theo trọng số." },
      { id: 4, front: "ReLU (Rectified Linear Unit)", back: "Hàm kích hoạt phổ biến f(x) = max(0, x), trả về giá trị dương nếu x > 0." }
    ];

    let currentIndex = 0;
    let isFlipped = false;

    async function loadFlashcards() {
      try {
        const resTopics = await fetch(`/api/topics/document/${docId}`);
        if (resTopics.ok) {
          const topics = await resTopics.json();
          if (topics.length > 0) {
            const topicId = topics[0].children && topics[0].children.length > 0 ? topics[0].children[0].id : topics[0].id;
            const resCards = await fetch(`/api/flashcards/topic/${topicId}`);
            if (resCards.ok) {
              const serverCards = await resCards.json();
              if (serverCards.length > 0) {
                flashcards = serverCards;
              }
            }
          }
        }
      } catch (err) {
        console.error("Dùng bộ dữ liệu mẫu flashcard", err);
      }
      updateCardDisplay();
    }

    function flipCard() {
      isFlipped = !isFlipped;
      const inner = document.getElementById("flashCardInner");
      if (isFlipped) {
        inner.classList.add("is-flipped");
      } else {
        inner.classList.remove("is-flipped");
      }
    }

    function updateCardDisplay() {
      if (flashcards.length === 0) return;
      const card = flashcards[currentIndex];
      document.getElementById("cardFront").textContent = card.front;
      document.getElementById("cardBack").textContent = card.back;
      
      const pos = currentIndex + 1;
      document.getElementById("progressText").textContent = `${pos} / ${flashcards.length} Thẻ`;
      document.getElementById("progressBar").style.width = (pos / flashcards.length) * 100 + "%";
    }

    function nextCard() {
      isFlipped = false;
      document.getElementById("flashCardInner").classList.remove("is-flipped");
      setTimeout(() => {
        if (currentIndex < flashcards.length - 1) {
          currentIndex++;
        } else {
          currentIndex = 0;
        }
        updateCardDisplay();
      }, 200);
    }

    function prevCard() {
      isFlipped = false;
      document.getElementById("flashCardInner").classList.remove("is-flipped");
      setTimeout(() => {
        if (currentIndex > 0) {
          currentIndex--;
        } else {
          currentIndex = flashcards.length - 1;
        }
        updateCardDisplay();
      }, 200);
    }

    loadFlashcards();
    lucide.createIcons();
  </script>
</body>
</html>
